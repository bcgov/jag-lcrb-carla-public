server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets can be cached for a long time; images in public/ keep stable names, so they revalidate.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths load index.html and the router decides.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
