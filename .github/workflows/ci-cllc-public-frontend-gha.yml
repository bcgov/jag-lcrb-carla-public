name: CI - cllc-public-frontend-gha
run-name: "CI cllc-public-frontend-gha → ${{ github.ref_name }}"

on:
  push:
    branches: [develop, test]
    paths:
      - 'cllc-public-app/ClientApp/**'
      - 'cllc-public-app/Dockerfile.frontend.gha'
      - 'cllc-public-app/nginx.conf.gha'
      - '.github/workflows/ci-cllc-public-frontend-gha.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/bcgov/jag-lcrb-carla-public/cllc-public-frontend-gha

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set environment tag and build script
        id: env-tag
        run: |
          case "${{ github.ref_name }}" in
            develop)      echo "ENV_TAG=dev"         >> $GITHUB_OUTPUT
                          echo "BUILD_SCRIPT=build"     >> $GITHUB_OUTPUT ;;
            test)         echo "ENV_TAG=test"        >> $GITHUB_OUTPUT
                          echo "BUILD_SCRIPT=build"     >> $GITHUB_OUTPUT ;;
            master)       echo "ENV_TAG=prod"        >> $GITHUB_OUTPUT
                          echo "BUILD_SCRIPT=buildprod" >> $GITHUB_OUTPUT ;;
            dv-migration) echo "ENV_TAG=sandbox-dev"     >> $GITHUB_OUTPUT
                          echo "BUILD_SCRIPT=build-sandbox" >> $GITHUB_OUTPUT ;;
          esac

      - name: Inject UI version info
        run: |
          FILE=cllc-public-app/ClientApp/src/app/components/version-info/version-info-dialog.component.html
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          sed -i "s#<!-- UI_GIT_REF -->#${{ github.ref_name }}#" "$FILE"
          sed -i "s#<!-- UI_GIT_REPO -->#https://github.com/${{ github.repository }}#" "$FILE"
          sed -i "s#<!-- UI_GIT_COMMIT -->#${{ github.sha }}#" "$FILE"
          sed -i "s#<!-- UI_BUILD_DATE -->#$BUILD_DATE#" "$FILE"

      - name: Set build version
        run: |
          # Auto-incrementing build number (CI run number) — set at build time
          # only, never committed back to git (avoids a bot-commit CI loop).
          npm --prefix cllc-public-app/ClientApp version "1.0.${{ github.run_number }}" \
            --no-git-tag-version --allow-same-version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for the cache-to/cache-from below. The default buildx builder
      # uses the "docker" driver, which cannot export a cache
      # ("Cache export is not supported for the docker driver"). This creates a
      # builder on the docker-container driver, which can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to commit SHA after first run

      - name: Build and push image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./cllc-public-app
          file: ./cllc-public-app/Dockerfile.frontend.gha
          push: true
          # GitHub runners are ephemeral, so buildx starts with an empty layer
          # cache every run and re-installs node_modules from scratch even when
          # package-lock.json hasn't changed. The Dockerfile already copies
          # package*.json before `npm ci` so that layer IS cacheable — it just
          # had nowhere to persist. type=gha stores it in the Actions cache.
          # mode=max is required: the expensive layer lives in the `builder`
          # stage, and the default (min) only caches layers of the final image.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            BUILD_SCRIPT=${{ steps.env-tag.outputs.BUILD_SCRIPT }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.env-tag.outputs.ENV_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ github.ref_name == 'master' && format('{0}:prod-sha-{1}', env.IMAGE_NAME, github.sha) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/bcgov/jag-lcrb-carla-public
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Trigger deployment
        if: success() && steps.env-tag.outputs.ENV_TAG != ''
        uses: peter-evans/repository-dispatch@v3  # TODO: pin to commit SHA after first run
        with:
          token: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          repository: bcgov-c/lcrb-carla-pipelines
          event-type: deploy
          client-payload: '{"service":"cllc-public-frontend","env":"${{ steps.env-tag.outputs.ENV_TAG }}","image":"${{ env.IMAGE_NAME }}:${{ steps.env-tag.outputs.ENV_TAG }}"}'
